<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- CSS-Styles -->
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <!-- Favicon/Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


    <!-- JS-Scripte -->
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/script.js"></script>

    <title>Deine Bestellung</title>
</head>

<body onload="init()">
    <div class="page-wrapper">
        <header>
            <img src="./assets/img/Logo.png" alt="Logo">
            <nav class="myLinks" id="myLinks">
                <a onclick="alertEdit()" class="menu-link" href="#">Bestellung</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Fahrer*in werden</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Partner werden</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Anmelden</a>
            </nav>

            <div id="mobileNav" class="mobile-nav">
                <a onclick="alertEdit()" class="menu-link" href="#">Bestellung</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Fahrer*in werden</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Partner werden</a>
                <a onclick="alertEdit()" class="menu-link" href="#">Anmelden</a>
            </div>

            <a href="javascript:void(0);" class="icon burger-menu" onclick="showMenu()">
                <i class="fa fa-bars"></i>
            </a>
        </header>

        <main class="content_wrapper">
            <section class="content" id="content">
                <div class="content_header">
                    <h1 onclick="filterCategory('pizza')">Pizza</h1>
                    <h1 onclick="filterCategory('pasta')">Pasta</h1>
                    <h1 onclick="filterCategory('salat')">Salate</h1>
                </div>
                <div class="menu_wrapper" id="menuWrapper">
                </div>
            </section>

            <section class="basket_wrapper" id="basketWrapper">
                <div class="basket">
                    <div class="basket-header seperator">
                        <h3>Warenkorb</h3>
                    </div>
                    <div class="basket-content seperator" id="basketContent">
                    </div>
                    <!-- <div class="basket-worth">
                    <table>
                        <tr>
                            <td class="td-txt txt-color-sec">Zwischensumme:</td>
                            <td class="td-sum txt-color-sec">Summe</td>
                        </tr>
                        <tr>
                            <td class="td-txt txt-color-sec">Liefergebühr:</td>
                            <td class="td-txt txt-color-sec">5,00</td>
                        </tr>
                        <tr>
                            <td class="txt-bold">Gesamtkosten:</td>
                            <td class="txt-bold">SUMME</td>
                        </tr>
                    </table>
                 </div> -->
                    <div class="basket-worth">
                        <div class="flx txt-color-sec">
                            <p style="width: 165px;">Zwischensumme:</p>
                            <p id="subtotal">0,00</p> €
                        </div>
                        <div class="flx txt-color-sec">
                            <p style="width: 165px;">Liefergebühr:</p>
                            <p>5,00</p> €
                        </div>
                        <div class="flx txt-bold">
                            <p style="width: 165px;">Gesamtkosten:</p>
                            <p id="total">0,00</p> €
                        </div>
                        <div class="order">
                            <button id="orderBtn" class="order-btn" onclick="sendOrder()">Bestellen</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <section onclick="openRespBasket()" class="basket_responsive" id="basketResponsive">
            <div class="basket_wrapper_responsive">
                <div onclick="preventBubbling(event)" class="basket-content-responsive d-none"
                    id="basketContentResponsive-overlay">
                    <div id="basketContentResponsive">
                    </div>
                </div>
                <div class="basketRes" id="headline-basket-resp">
                </div>
            </div>
        </section>

        <footer>
            <a href="#">Impressum</a>
            <a href="#">Datenschutz</a>
            <a href="#">AGB</a>
        </footer>
    </div>
</body>

</html>
